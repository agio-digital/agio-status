name: Publish patched Upptime
on:
  push:
    branches: [main]
    paths: [package.json, yarn.lock, .yarnrc.yml, '.yarn/patches/**', 'scripts/**', 'assets/**', .upptimerc.yml, .github/workflows/publish-patched.yml]
  workflow_run:
    workflows: [Uptime CI, Response Time CI, Summary CI, Graphs CI]
    types: [completed]
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: publish-patched-upptime
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn build
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: dist
          keep_files: false
          user_name: Upptime Bot
          user_email: 73812536+upptime-bot@users.noreply.github.com
