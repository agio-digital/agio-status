name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          # Configure the secret allowlist in .upptimerc.yml; do not edit this workflow directly.
          SECRETS_CONTEXT: '{"NOTIFICATION_SLACK":${{ toJson(secrets.NOTIFICATION_SLACK) }},"NOTIFICATION_SLACK_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_SLACK_WEBHOOK_URL) }}}'
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Generate graphs
        id: dispatch_graphs
        uses: benc-uk/workflow-dispatch@v1
        continue-on-error: true
        with:
          workflow: Graphs CI
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Setup Node.js for direct graph generation
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Generate graphs directly if dispatch fails
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      # Site build + deploy moved to .github/workflows/publish-patched.yml, which
      # builds the patched @upptime/status-page (customFootHtml, no client-side
      # GitHub API calls). Do not re-add the legacy "site" command/deploy here:
      # it would publish the unpatched build over the patched one.
