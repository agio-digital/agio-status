      href: https://github.com/agio-digital/agio-status/issues
    - title: Docs
      href: https://docs.agiodigital.com/
  customFootHtml: '<section class="container" aria-labelledby="support-title" style="margin:2rem auto"><h2 id="support-title">Need help?</h2><p><a href="mailto:devs@agiodigital.com">Contact Agio support</a> about your app or integration. Include the affected service and a request ID, if available.</p><p><a href="https://docs.agiodigital.com/">Developer documentation</a></p></section>'

  # Cache repeat incident/history reads for one monitoring interval.
  productionCacheTime: 300000
